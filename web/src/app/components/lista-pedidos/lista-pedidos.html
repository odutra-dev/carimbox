<div class="container">
  <!-- Header personalizado -->
  <div class="app-header">
    <h1>Carimbox</h1>
    <button class="btn-novo-pedido" (click)="novoPedido()">
      <i class="bi bi-plus-circle"></i> Novo Pedido
    </button>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <button [class.active]="filtro === 'pendentes'" (click)="setFiltro('pendentes')">
      Pendentes
    </button>

    <button [class.active]="filtro === 'concluidos'" (click)="setFiltro('concluidos')">
      Concluídos
    </button>

    <button [class.active]="filtro === 'todos'" (click)="setFiltro('todos')">Todos</button>
  </div>

  <!-- Mensagens de loading ou erro -->
  <div *ngIf="loading" class="loading">Carregando...</div>
  <div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>

  <!-- Lista de pedidos filtrada -->
  <div *ngIf="!loading && pedidosFiltrados.length > 0">
    <div
      *ngFor="let pedido of pedidosFiltrados"
      class="pedido-card"
      (click)="verDetalhes(pedido.id)"
    >
      <div class="header">
        <div class="info">
          <!-- Barra colorida corrigida -->
          <div
            class="label-bar"
            [style.backgroundColor]="
              pedido.label === 'Carimbo'
                ? '#DA1325'
                : pedido.label === 'Mdf/Acrílico'
                  ? '#16A34A'
                  : pedido.label === 'Outros'
                    ? '#C59E0B'
                    : '#9E9E9E'
            "
          ></div>

          <p class="id-text">Pedido #{{ pedido.id }}</p>
          <p class="data-text">
            {{ pedido.data_pedido | date: 'dd/MM/yyyy, HH:mm' }}
          </p>
          <p class="cliente-text">
            {{ formatarWhatsapp(pedido.whatsapp.toString()) }}
          </p>
        </div>

        <div class="icon-container" (click)="$event.stopPropagation()">
          <button class="icon icon-print" (click)="imprimirCupom(pedido, $event)" title="Imprimir Cupom">
            <i class="bi bi-printer-fill"></i>
          </button>

          <ng-container *ngIf="!pedido.entregue">
            <button class="icon-check" (click)="marcarComoEntregue(pedido)" title="Marcar como entregue">
              <i class="bi bi-check-circle-fill"></i>
            </button>
          </ng-container>

          <button class="icon" (click)="enviarWhatsApp(pedido)" title="Enviar no WhatsApp">
            <i class="bi bi-box-arrow-up-right"></i>
          </button>

          <ng-container *ngIf="!pedido.entregue">
            <button class="icon icon-delete" (click)="excluirPedido(pedido, $event)" title="Remover pedido">
              <i class="bi bi-trash3-fill"></i>
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensagem caso não haja pedidos filtrados -->
  <div *ngIf="!loading && pedidosFiltrados.length === 0" class="empty">
    Nenhum pedido encontrado.
  </div>
</div>
